name: Build Windows Application

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Tesseract OCR
        run: choco install tesseract -y

      - name: Inject Secrets
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        run: |
          python -c "import os; open('firebase_config.json', 'w').write(os.environ.get('FIREBASE_CONFIG', '{}'))"
          python -c "import os; open('src/ir-attendance-497712-b3ae57837200.json', 'w').write(os.environ.get('GCP_CREDENTIALS', '{}'))"

      - name: Build Executable
        run: pyinstaller IR_Attendance.spec

      - name: Compile Installer (Inno Setup)
        run: |
          iscc IR_Attendance_Setup.iss

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IR_Attendance_Installer
          path: installer_output/IR_Attendance_Setup.exe
